name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint, typecheck, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: File check (size and secret-name patterns)
        run: pnpm check:files
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  e2e:
    name: e2e (demo, a11y, sandbox)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install Chromium
        run: pnpm --filter @drishti/e2e exec playwright install --with-deps chromium
      - name: Demo journeys and accessibility (docs/12 §1)
        run: pnpm --filter @drishti/e2e exec playwright test --project=demo --project=a11y
      - name: Sandbox with your own files and linked sheets (E2E-24, E2E-27)
        run: pnpm --filter @drishti/e2e exec playwright test --project=sandbox
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-e2e
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  visual:
    name: visual (design/screens)
    # The design PNGs were rendered on Windows; Linux font smoothing alone differs by about 4 %, over the 3 % tolerance.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install Chromium
        run: pnpm --filter @drishti/e2e exec playwright install chromium
      - name: Visual regression against design/screens (docs/12 §5)
        run: pnpm --filter @drishti/e2e exec playwright test --project=visual
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-visual
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  lighthouse:
    name: lighthouse (/demo and /)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Lighthouse CI (docs/12 §1; thresholds in lighthouserc.json)
        run: npx -y @lhci/cli@0.15.1 autorun

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
