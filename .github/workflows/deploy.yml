name: deploy

# Push to main → staging. Tag v* → production. docs/14-SETUP-RUNBOOK.md §6.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      env:
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.env || (startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging') }}
    concurrency:
      group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.env || (startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging') }}
      cancel-in-progress: false
    env:
      TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.env || (startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging') }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Apply D1 migrations
        run: |
          if [ "$TARGET" = production ]; then
            pnpm exec wrangler d1 migrations apply drishti --remote
          else
            pnpm exec wrangler d1 migrations apply drishti-staging --remote --env staging
          fi
      - name: Deploy Worker
        run: |
          SHA="${GITHUB_SHA::7}"
          if [ "$TARGET" = production ]; then
            pnpm exec wrangler deploy --var "VERSION:$SHA"
          else
            pnpm exec wrangler deploy --env staging --var "VERSION:$SHA"
          fi
      - name: Smoke test (health and SPA shell)
        env:
          DRISHTI_URL: ${{ vars.DRISHTI_URL }}
        run: |
          SHA="${GITHUB_SHA::7}"
          for i in 1 2 3 4 5 6; do
            body=$(curl -fsS "$DRISHTI_URL/api/health" || true)
            echo "$body" | grep -q "\"version\":\"$SHA\"" && break
            sleep 5
          done
          echo "$body" | grep -q "\"version\":\"$SHA\"" || { echo "health check failed: $body"; exit 1; }
          curl -fsS "$DRISHTI_URL/" | grep -q '<div id="root">' || { echo "SPA shell missing"; exit 1; }
          echo "Deployed $SHA to $TARGET: $DRISHTI_URL"
